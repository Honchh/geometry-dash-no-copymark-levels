<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gd-clean-levels // Honchh</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.5;
      padding: 40px 20px;
    }

    .wrapper {
      max-width: 680px;
      margin: 0 auto;
    }

    header {
      border-bottom: 1px solid #30363d;
      padding-bottom: 20px;
      margin-bottom: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .title-area h1 {
      font-size: 1.4rem;
      color: #f0f6fc;
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
    }

    .title-area p {
      font-size: 0.9rem;
      color: #8b949e;
      margin-top: 4px;
    }

    .gh-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #21262d;
      color: #c9d1d9;
      border: 1px solid #363b42;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .gh-btn:hover {
      background-color: #30363d;
      border-color: #8b949e;
      color: #ffffff;
    }

    .box {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 24px;
    }

    .box-header {
      font-size: 1rem;
      font-weight: 600;
      color: #f0f6fc;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      height: 8px;
      width: 8px;
      background-color: #3fb950;
      border-radius: 50%;
      display: inline-block;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #c9d1d9;
      margin-bottom: 6px;
    }

    label span {
      color: #8b949e;
      font-weight: 400;
    }

    input, textarea {
      width: 100%;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px 12px;
      color: #c9d1d9;
      font-size: 0.9rem;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #58a6ff;
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button[type="submit"] {
      background-color: #238636;
      color: #ffffff;
      border: 1px solid rgba(240, 246, 252, 0.1);
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    button[type="submit"]:hover {
      background-color: #2ea043;
    }

    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    footer {
      margin-top: 24px;
      font-size: 0.8rem;
      color: #8b949e;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    footer code {
      background: #161b22;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #30363d;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <div class="title-area">
        <h1>Honchh / gd-clean-levels</h1>
        <p>Sanitized .gmd files — no (C) mark, stripped metadata.</p>
      </div>
      <a class="gh-btn" href="https://github.com" target="_blank" rel="noopener noreferrer">
        <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        View Repository
      </a>
    </header>

    <div class="box">
      <div class="box-header">
        <span class="status-dot"></span>
        Request a Level
      </div>

      <form id="requestForm" action="https://web3forms.com" method="POST">
        <input type="hidden" name="access_key" value="a41deabd-998d-4d7b-bd60-397faf1fd4a9" />
        <input type="hidden" name="subject" value="[GD Level Request] New Submission" />
        <input type="hidden" name="from_name" value="GD Clean Levels" />

        <div class="field">
          <label for="level">Level Name *</label>
          <input type="text" id="level" name="Level Name" placeholder="iSpyWithMyLittleEye" required />
        </div>

        <div class="field">
          <label for="id">Level ID <span>(optional)</span></label>
          <input type="text" id="id" name="Level ID" placeholder="89886591" />
        </div>

        <div class="field">
          <label for="creator">Creator <span>(optional)</span></label>
          <input type="text" id="creator" name="Creator" placeholder="Voxicat" />
        </div>

        <div class="field">
          <label for="notes">Notes <span>(optional)</span></label>
          <textarea id="notes" name="Notes" placeholder="Specific version, LDM, etc."></textarea>
        </div>

        <button type="submit" id="submitBtn">Submit Request</button>
        <p id="statusMsg" style="margin-top:12px; font-size:0.85rem; color:#3fb950; display:none;">
          ✓ Request sent! Thanks.
        </p>
      </form>
    </div>

    <footer>
      <span>Direct contact: <code>help.honch@web.de</code></span>
      <span>For GDShare / Geode</span>
    </footer>
  </div>

  <script>
    const form = document.getElementById('requestForm');
    const btn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Sending...';
      statusMsg.style.display = 'none';

      try {
        const formData = new FormData(form);
        const res = await fetch('https://web3forms.com', {
          method: 'POST',
          body: formData
        });

        if (res.ok) {
          form.reset();
          statusMsg.style.color = '#3fb950';
          statusMsg.textContent = '✓ Request sent! Thanks.';
          statusMsg.style.display = 'block';
        } else {
          throw new Error('Failed');
        }
      } catch (err) {
        statusMsg.style.color = '#f85149';
        statusMsg.textContent = 'Error sending request. Try again later.';
        statusMsg.style.display = 'block';
      }

      btn.disabled = false;
      btn.textContent = 'Submit Request';
    });
  </script>
</body>
</html>
