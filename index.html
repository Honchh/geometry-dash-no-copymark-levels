<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GD Clean Levels — Request & Archive</title>
  <style>
    :root {
      --bg: #0f111a;
      --card: #181c2b;
      --border: #2a314a;
      --primary: #00e5ff;
      --accent: #7cff01;
      --text: #eef2ff;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1b2238 0%, var(--bg) 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .badge {
      display: inline-block;
      background: rgba(124, 255, 1, 0.12);
      color: var(--accent);
      border: 1px solid rgba(124, 255, 1, 0.35);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }

    p.subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .repo-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, #24292f, #161b22);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid #444c56;
      border-radius: 10px;
      transition: transform 0.15s ease, border-color 0.15s ease;
      margin-bottom: 28px;
    }

    .repo-btn:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin-bottom: 24px;
    }

    h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    input, textarea, select {
      width: 100%;
      padding: 12px 14px;
      background: #101420;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--primary);
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), #0099ff);
      color: #071019;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.15s ease;
      margin-top: 6px;
    }

    .submit-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .footer-note {
      margin-top: 18px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .footer-note a {
      color: var(--primary);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">● Level Requests Open</span>
    <h1>GD Clean Levels</h1>
    <p class="subtitle">
      Geometry Dash <code>.gmd</code> levels exported with <strong>No (C) Mark</strong> and <strong>Clean Metadata</strong> — ready to import via GDShare / Geode.
    </p>

    <!-- Repository Button -->
    <a
      class="repo-btn"
      href="https://github.com/Honchh/geometry-dash-no-copymark-levels/tree/main"
      target="_blank"
      rel="noopener noreferrer"
    >
      <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      Browse Levels on GitHub
    </a>

    <hr />

    <h2>Request a Level</h2>
    <form id="requestForm">
      <div class="form-group">
        <label for="levelName">Level Name *</label>
        <input type="text" id="levelName" placeholder="e.g. Bloodbath, Tidal Wave, Sonic Wave..." required />
      </div>

      <div class="form-group">
        <label for="levelId">Level ID (Optional, helps find exact version)</label>
        <input type="text" id="levelId" placeholder="e.g. 10565740" />
      </div>

      <div class="form-group">
        <label for="creator">Original Creator (Optional)</label>
        <input type="text" id="creator" placeholder="e.g. Riot" />
      </div>

      <div class="form-group">
        <label for="notes">Extra Notes (Optional)</label>
        <textarea id="notes" placeholder="Any specific version, LDM, or notes..."></textarea>
      </div>

      <button type="submit" class="submit-btn">Send Level Request via Email</button>
    </form>

    <div class="footer-note">
      Requests are sent to <a href="mailto:help.honch@web.de">help.honch@web.de</a>
    </div>
  </div>

  <script>
    document.getElementById('requestForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const levelName = document.getElementById('levelName').value.trim();
      const levelId = document.getElementById('levelId').value.trim() || 'Not specified';
      const creator = document.getElementById('creator').value.trim() || 'Not specified';
      const notes = document.getElementById('notes').value.trim() || 'None';

      const subject = encodeURIComponent(`[GD Level Request] ${levelName}`);
      const body = encodeURIComponent(
        `Hey Honch,\n\nI would like to request the following Geometry Dash level (No C-Mark, Clean Metadata):\n\n` +
        `• Level Name: ${levelName}\n` +
        `• Level ID: ${levelId}\n` +
        `• Creator: ${creator}\n` +
        `• Notes: ${notes}\n\n` +
        `Thanks!`
      );

      window.location.href = `mailto:help.honch@web.de?subject=${subject}&body=${body}`;
    });
  </script>
</body>
</html>
