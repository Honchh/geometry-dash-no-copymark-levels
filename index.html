<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gd-clean-levels - Honchh</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#111;color:#e5e5e5;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:14px;line-height:1.6;padding:40px 20px 60px}
    main{max-width:580px;margin:0 auto}
    h1{font-size:1.15rem;font-weight:700;color:#fff;margin-bottom:4px}
    .sub{color:#888;margin-bottom:20px}
    nav{margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid #262626;display:flex;gap:16px;flex-wrap:wrap}
    a{color:#60a5fa;text-decoration:none}
    a:hover{text-decoration:underline}
    h2{font-size:.95rem;font-weight:700;color:#fff;margin-bottom:14px}
    .field{margin-bottom:14px}
    label{display:block;color:#a3a3a3;margin-bottom:4px;font-size:.85rem}
    input,textarea{width:100%;background:#181818;border:1px solid #2e2e2e;color:#fff;padding:8px 10px;font-family:inherit;font-size:.9rem;border-radius:3px}
    input:focus,textarea:focus{outline:none;border-color:#60a5fa}
    textarea{min-height:80px;resize:vertical}
    button{background:#fff;color:#111;border:none;padding:8px 16px;font-family:inherit;font-size:.85rem;font-weight:700;cursor:pointer;border-radius:3px;margin-top:4px}
    button:hover{background:#d4d4d4}
    button:disabled{opacity:.5;cursor:not-allowed}
    #statusMsg{margin-top:12px;display:none}
    footer{margin-top:32px;padding-top:16px;border-top:1px solid #262626;color:#737373;font-size:.8rem}
    .version-tag{position:fixed;bottom:10px;left:12px;font-size:.75rem;color:#525252}
  </style>
</head>
<body>
  <main>
    <h1>Honchh - gd-clean-levels</h1>
    <p class="sub">Sanitized .gmd files - no (C) mark, stripped metadata.</p>

    <nav>
      <a href="https://github.com" target="_blank" rel="noopener noreferrer">[GitHub Repository]</a>
      <a href="https://github.com/issues" target="_blank" rel="noopener noreferrer">[Open Issues]</a>
    </nav>

    <h2>Request a level</h2>
    <form id="requestForm">
      <div class="field">
        <label for="level">Level name *</label>
        <input type="text" id="level" name="level_name" placeholder="iSpyWithMyLittleEye" required />
      </div>

      <div class="field">
        <label for="id">Level ID (optional)</label>
        <input type="text" id="id" name="level_id" placeholder="89886591" />
      </div>

      <div class="field">
        <label for="creator">Creator (optional)</label>
        <input type="text" id="creator" name="creator" placeholder="Voxicat" />
      </div>

      <div class="field">
        <label for="notes">Notes (optional)</label>
        <textarea id="notes" name="notes" placeholder="Specific version, LDM, etc."></textarea>
      </div>

      <button type="submit" id="submitBtn">Send request</button>
      <p id="statusMsg"></p>
    </form>

    <footer>
      Contact: help.honch@web.de - For GDShare - Geode
    </footer>
  </main>

  <div class="version-tag">v.0.8</div>

  <script>
    emailjs.init({ publicKey: '_95WRzX2hDP1zWayR' });

    const form = document.getElementById('requestForm');
    const btn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Sending...';
      statusMsg.style.display = 'none';

      try {
        await emailjs.sendForm('service_h0j0dgd', 'template_fy7upui', form);
        form.reset();
        statusMsg.style.color = '#4ade80';
        statusMsg.textContent = 'Sent to help.honch@web.de.';
        statusMsg.style.display = 'block';
      } catch (err) {
        statusMsg.style.color = '#f87171';
        statusMsg.textContent = 'Error: ' + (err.text || err.message || JSON.stringify(err));
        statusMsg.style.display = 'block';
      }

      btn.disabled = false;
      btn.textContent = 'Send request';
    });
  </script>
</body>
</html>
